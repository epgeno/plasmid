[package]
name = "plasmid-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BitTorrent v2 and WebRTC peer-to-peer chunk exchange layer for plasmid"

[dependencies]
plasmid-format = { path = "../plasmid-format" }
thiserror = "2.0"
bytes = "1.10"
tokio = { version = "1.43", features = ["sync", "macros", "rt"] }
tracing = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
