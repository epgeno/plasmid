[package]
name = "plasmid-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core genomic range-slicing and byte streaming engine for plasmid"

[dependencies]
plasmid-format = { path = "../plasmid-format" }
thiserror = "2.0"
bytes = "1.10"
noodles = { version = "0.113", features = ["core", "fasta", "fastq", "sam", "bam", "vcf"] }
tokio = { version = "1.43", features = ["sync", "io-util"] }
